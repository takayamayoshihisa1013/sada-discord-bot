name: Discord Silly Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run script
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        SILLY_MESSAGES: ${{ secrets.SILLY_MESSAGES }}
      run: python main.py

    # ==========================================
    # ▼ ここから下が今回追加した「救出コード」です ▼
    # ==========================================
    - name: メッセージ救出（テキストファイルに書き出す）
      env:
        SILLY_MESSAGES: ${{ secrets.SILLY_MESSAGES }}
      run: echo "$SILLY_MESSAGES" > rescue.txt

    - name: ファイルをダウンロード可能にする
      uses: actions/upload-artifact@v4
      with:
        name: rescued-messages
        path: rescue.txt